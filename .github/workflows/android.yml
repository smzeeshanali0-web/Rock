name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write   # only used to attach the APK to the "latest-apk" release (see last step)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Works even if the project was uploaded one level deeper (e.g. AI-Clone-Dialer/android-app)
      - name: Locate Android project
        id: find
        run: |
          f=$(find . -name settings.gradle.kts -not -path '*/node_modules/*' | head -1)
          if [ -z "$f" ]; then
            echo "settings.gradle.kts not found - android-app folder was not uploaded"
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
          echo "Android project: $(dirname "$f")"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The ubuntu runner already ships the Android SDK; only add the platform/build-tools we need.
      - name: Prepare Android SDK
        run: |
          SDK="\( {ANDROID_HOME:- \){ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK at $SDK"
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SM" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" || true
          echo "sdk.dir=\( SDK" > " \){{ steps.find.outputs.dir }}/local.properties"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show APK
        run: ls -lh "${{ steps.find.outputs.dir }}"/app/build/outputs/apk/debug/

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      # Direct download on your phone: repo -> Releases -> "latest-apk" -> the .apk file (no zip, no artifacts page).
      - name: Publish APK to the "latest-apk" release
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Latest APK (auto-built)
          prerelease: true
          files: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk

      # If the build fails: the exact error lines are shown on the run's Summary page (copy them and send).
      - name: Summarize build errors
        if: failure()
        run: |
          {
            echo "### Build failed - copy the lines below and send them"
            echo '```'
            if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
              grep -E "^e: |error:|FAILURE:|What went wrong|Execution failed|Could not resolve|Unresolved reference" -A3 "$GITHUB_WORKSPACE/build.log" | head -100
            else
              echo "No build.log (a step before Gradle failed - see the red step above)."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log and reports (only if the build failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            ${{ steps.find.outputs.dir }}/app/build/reports
          if-no-files-found: ignore
